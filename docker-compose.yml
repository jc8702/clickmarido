version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: clickmarido-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: clickmarido_db
      POSTGRES_USER: clickmarido_user
      POSTGRES_PASSWORD: clickmarido_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - clickmarido-network

volumes:
  pgdata:
    driver: local

networks:
  clickmarido-network:
    driver: bridge
