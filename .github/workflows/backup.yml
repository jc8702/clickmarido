name: Database Backup

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 03:00 UTC
  workflow_dispatch:       # Manual trigger

jobs:
  backup:
    name: Backup Supabase to S3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run Backup Script
        run: bash scripts/backup-supabase.sh
        env:
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'sa-east-1' }}
          S3_BUCKET: ${{ secrets.S3_BACKUP_BUCKET || 'clickmarido-db-backups' }}
          BACKUP_DIR: ./backups
          RETENTION_DAYS: 30

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backups/clickmarido_latest.sql.gz
          retention-days: 30
