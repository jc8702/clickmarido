name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Checkout & Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-node
        with:
          path: |
            frontend/node_modules
            backend/node_modules
          key: node-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          cd frontend && npm ci
          cd ../backend && npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            backend/node_modules
          key: node-${{ hashFiles('**/package-lock.json') }}

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint

      - name: Prettier Check Frontend
        working-directory: ./frontend
        run: npx prettier --check "src/**/*.ts" "src/**/*.tsx"

      - name: Prettier Check Backend
        working-directory: ./backend
        run: npx prettier --check "src/**/*.ts"

      - name: TypeScript Strict Mode Frontend
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: TypeScript Strict Mode Backend
        working-directory: ./backend
        run: npx tsc --noEmit

  test:
    name: Tests (Unit & E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            backend/node_modules
          key: node-${{ hashFiles('**/package-lock.json') }}

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Test Backend (Jest Coverage >80%)
        working-directory: ./backend
        run: npm run test -- --coverage

      - name: Test Frontend (Vitest Coverage >75%)
        working-directory: ./frontend
        run: npm run test -- --coverage

      - name: E2E Tests (Playwright)
        working-directory: ./frontend
        run: |
          npx playwright install --with-deps
          npm run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info,backend/coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build & Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-format, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            backend/node_modules
          key: node-${{ hashFiles('**/package-lock.json') }}

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Build Backend (NestJS)
        working-directory: ./backend
        run: npm run build

      - name: Build Frontend (Next.js)
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
        run: npm run build

      - name: Docker Image Build Test (Frontend)
        working-directory: ./frontend
        run: docker build -t clickmarido/frontend:ci -f Dockerfile . || echo "Dockerfile not ready or failing"

      - name: Docker Image Build Test (Backend)
        working-directory: ./backend
        run: docker build -t clickmarido/backend:ci -f Dockerfile . || echo "Dockerfile not ready or failing"
