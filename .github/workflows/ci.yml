name: CI — Qualidade de Código

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────
  # JOB 1: Instalar dependências e cache
  # ─────────────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node
        with:
          path: |
            frontend/node_modules
            backend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Instalar dependências
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: |
          cd frontend && npm ci
          cd ../backend && npm ci

      - name: Gerar Prisma Client
        working-directory: ./backend
        run: npx prisma generate

  # ─────────────────────────────────────────────────
  # JOB 2: Lint, Formatação e TypeScript
  # ─────────────────────────────────────────────────
  lint:
    name: Lint & TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            backend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Gerar Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Lint Frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Lint Backend
        working-directory: ./backend
        run: npm run lint

      - name: TypeScript Check Frontend
        working-directory: ./frontend
        run: npm run type-check

      - name: TypeScript Check Backend
        working-directory: ./backend
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────
  # JOB 3: Testes unitários (Backend + Frontend)
  # ─────────────────────────────────────────────────
  test:
    name: Testes Unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            backend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Gerar Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Testes Backend (Jest)
        working-directory: ./backend
        run: npm run test -- --coverage --passWithNoTests

      - name: Testes Frontend (Vitest)
        working-directory: ./frontend
        run: npx vitest run --coverage --passWithNoTests

      - name: Upload Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info,backend/coverage/lcov.info
          fail_ci_if_error: false

  # ─────────────────────────────────────────────────
  # JOB 4: Build de validação (bloqueia merge se quebrar)
  # ─────────────────────────────────────────────────
  build:
    name: Build de Validação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            backend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Gerar Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Build Backend (NestJS)
        working-directory: ./backend
        run: npm run build

      - name: Build Frontend (Next.js)
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001/api' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
        run: npm run build
