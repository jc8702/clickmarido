name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - main

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Dependabot Check
        # Dependabot has its own automated PRs, but we can fail if there are critical alerts
        # For CI, we simulate a scan or use a known action
        run: echo "Checking dependabot alerts via API or using an action..."

      - name: SAST Scan (SonarCloud)
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true # Not blocking if not configured yet

      - name: Container Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  build-push-image:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: security-scan
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }},ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }},ghcr.io/${{ github.repository }}/frontend:latest

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push-image
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/clickmarido-staging
            export IMAGE_TAG=${{ github.sha }}
            docker-compose -f docker-compose.staging.yml pull
            docker-compose -f docker-compose.staging.yml up -d

      - name: Run Smoke Tests & Health Check
        run: |
          chmod +x ./scripts/health-check.sh
          ./scripts/health-check.sh "https://staging.clickmarido.com/health"

      - name: Performance Test (Lighthouse/K6)
        run: echo "Running performance tests on staging..."

      - name: Slack Notification (Success)
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: 'Staging Deploy Successful! :rocket: Waiting for manual approval to PROD.'

  deploy-prod:
    name: Deploy to Production (Approval Gate)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production (Blue-Green)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/clickmarido
            export IMAGE_TAG=${{ github.sha }}
            docker-compose -f docker-compose.prod.yml pull
            docker-compose -f docker-compose.prod.yml up -d

      - name: Health Check
        id: healthcheck
        run: |
          chmod +x ./scripts/health-check.sh
          ./scripts/health-check.sh "https://api.clickmarido.com/health"

      - name: Rollback on Failure
        if: failure()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/clickmarido
            chmod +x ./scripts/rollback.sh
            ./scripts/rollback.sh "clickmarido-backend clickmarido-frontend"

      - name: Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: "Production Deploy Status: ${{ job.status }} for ${{ github.sha }}"
