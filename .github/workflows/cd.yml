name: CD — Deploy para Produção

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────
  # Rodar migrations do banco (Neon)
  # A Vercel (Frontend e Backend) já pega o código
  # automaticamente no push.
  # ─────────────────────────────────────────────────
  migrate-database:
    name: Migrations (Neon PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Instalar dependências do backend
        working-directory: ./backend
        run: npm ci

      - name: Rodar migrations em produção
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy

  # ─────────────────────────────────────────────────
  # Deploy (Vercel)
  # ─────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy (Frontend & Backend via Vercel)
    runs-on: ubuntu-latest
    needs: migrate-database
    timeout-minutes: 5
    steps:
      - name: Sinalizar deploy
        run: |
          echo "✅ Migrations aplicadas no banco de dados."
          echo "A Vercel está encarregada de compilar e publicar os dois projetos (frontend e backend) automaticamente."
