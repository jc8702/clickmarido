name: Deploy Pipeline

on:
  push:
    branches: [ main ]
    # Dispara apenas quando houver mudanças nas pastas específicas, se preferir
    # paths:
    #  - 'frontend/**'
    #  - 'backend/**'

jobs:
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Exemplo genérico usando vercel-action
      # Requer VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID configurados nos secrets
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./frontend

  deploy-backend:
    name: Deploy Backend (VPS/Coolify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Exemplo genérico usando SSH action para dar git pull e restart
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/clickmarido
            git pull origin main
            cd backend
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart clickmarido-api || pm2 start dist/main.js --name clickmarido-api
            # Ou, se estiver usando Docker:
            # docker-compose -f docker-compose.prod.yml up -d --build backend
